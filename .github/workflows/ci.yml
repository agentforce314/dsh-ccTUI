name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm i -g pnpm@10
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:boundary
      - run: npm test
      - name: e2e (real dsh boot in a PTY, scripted LLM)
        run: npm run e2e
      - name: e2e (installed path via dsh plugin add)
        run: npm run e2e:install
